server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Aplicación institucional privada: no se indexa.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # El manifiesto de la aplicación lleva su propio tipo de medio.
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
  }

  # Los artefactos con hash son inmutables; el index nunca se cachea.
  #
  # nginx NO hereda los `add_header` del nivel superior en un bloque que declara
  # alguno propio: por eso las cabeceras de seguridad se repiten aquí. Sin esto
  # el documento principal y los artefactos se servirían sin ellas. (El respaldo
  # de la SPA, `try_files ... /index.html`, se atiende por el bloque del index.)
  location ~* \.(js|css|woff2|svg|png|jpg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  location = /index.html {
    add_header Cache-Control "no-store";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Las métricas son internas: no se publican por el origen web. La API, además,
  # exige su propio token. Va antes del proxy: una expresión regular gana al prefijo.
  location ~ ^/api/v[0-9]+/metrics/?$ {
    return 404;
  }

  # La API vive en su propio servicio de Cloud Run. Se expone bajo el mismo
  # origen para que el frontend siga llamando a /api/v1 con ruta relativa: sin
  # host embebido en el paquete, sin CORS y sin balanceador de por medio.
  # ${API_URL} lo sustituye nginx al arrancar el contenedor.
  location /api/ {
    proxy_pass ${API_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_read_timeout 120s;
    client_max_body_size 12m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
