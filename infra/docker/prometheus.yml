# Recolección de métricas de SIPRA PRÁCTICAS.
# En GCP el equivalente es Cloud Monitoring con el sidecar de managed Prometheus.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    proyecto: sipra-practicas

scrape_configs:
  - job_name: sipra-api
    # La ruta real lleva el prefijo y la versión de la API. El endpoint exige el
    # token METRICAS_TOKEN: guárdelo, sin salto de línea, en infra/docker/metricas.token
    # (está en .gitignore) y declárelo también en el .env de la API.
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metricas.token
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          servicio: api
          ambiente: dev

rule_files:
  - /etc/prometheus/alertas.yml
