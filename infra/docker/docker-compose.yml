# Entorno local de SIPRA PRÁCTICAS.
# En Google Cloud estos servicios son Cloud SQL, Memorystore y Cloud Run.
name: sipra

services:
  postgres:
    image: postgres:18-alpine
    container_name: sipra-postgres
    environment:
      POSTGRES_USER: sipra
      POSTGRES_PASSWORD: sipra_local_dev
      POSTGRES_DB: sipra_dev
      # Parámetros equivalentes a los de producción, a escala local.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - log_min_duration_statement=500
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipra -d sipra_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: sipra-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:latest
    container_name: sipra-prometheus
    profiles: ["observabilidad"]
    ports:
      - "9090:9090"
    volumes:
      - ../../infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: sipra-grafana
    profiles: ["observabilidad"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: sipra_local_dev
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  datos-postgres:
